<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="What the agent fleet creates on your Cloudflare account" font-family="Google Sans Flex, system-ui, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c5cff"/></marker></defs><rect x="220" y="24" width="676" height="472" rx="16" fill="#fafaf9" stroke="#d4d4d0" stroke-dasharray="5 5"/><text x="238" y="52" font-size="12" font-weight="600" fill="#6b6b70" letter-spacing=".04em">YOUR CLOUDFLARE ACCOUNT</text><path d="M196 260 C280 260 280 260 364 260" fill="none" stroke="#7c5cff" stroke-width="1.6" marker-end="url(#arrow)"/><text x="280" y="250" text-anchor="middle" font-size="12" fill="#6b6b70">upload, run, delete</text><path d="M584 260 C618 260 618 116 652 116" fill="none" stroke="#7c5cff" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M584 260 C618 260 618 220 652 220" fill="none" stroke="#7c5cff" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M584 260 C618 260 618 324 652 324" fill="none" stroke="#7c5cff" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M762 364 L762 388" fill="none" stroke="#7c5cff" stroke-width="1.6" marker-end="url(#arrow)"/><g><rect x="24" y="212" width="172" height="96" rx="10" fill="#18181b" stroke="#18181b" stroke-width="1.2"/><text x="38" y="238" font-size="15" font-weight="600" fill="#ffffff">port</text><text x="38" y="258" font-size="11.5" fill="#c9c9cf">installs, runs and</text><text x="38" y="273" font-size="11.5" fill="#c9c9cf">tears down with your</text><text x="38" y="288" font-size="11.5" fill="#c9c9cf">sign-in</text></g><g><rect x="364" y="220" width="220" height="80" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.2"/><text x="378" y="246" font-size="15" font-weight="600" fill="#18181b">Fleet Worker</text><text x="378" y="266" font-size="11.5" fill="#6b6b70">port-fleet-&#60;id&#62;.workers.dev</text></g><g><rect x="652" y="76" width="220" height="80" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.2"/><text x="666" y="102" font-size="15" font-weight="600" fill="#18181b">Durable Object</text><text x="666" y="122" font-size="11.5" fill="#6b6b70">Agent, one per agent: loop,</text><text x="666" y="137" font-size="11.5" fill="#6b6b70">files</text></g><g><rect x="652" y="180" width="220" height="80" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.2"/><text x="666" y="206" font-size="15" font-weight="600" fill="#18181b">Worker Loader</text><text x="666" y="226" font-size="11.5" fill="#6b6b70">tests run in a fresh isolate</text></g><g><rect x="652" y="284" width="220" height="80" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.2"/><text x="666" y="310" font-size="15" font-weight="600" fill="#18181b">Workers AI</text><text x="666" y="330" font-size="11.5" fill="#6b6b70">model calls on your bill</text></g><g><rect x="652" y="388" width="220" height="80" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.2"/><text x="666" y="414" font-size="15" font-weight="600" fill="#18181b">AI Gateway</text><text x="666" y="434" font-size="11.5" fill="#6b6b70">port-fleet-&#60;id&#62;: logs and</text><text x="666" y="449" font-size="11.5" fill="#6b6b70">limits</text></g></svg>
